[metadata]
name = mygerrit-cli
version = 0.1.0
description = Standalone Gerrit command line tool

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    PyYAML>=6,<7

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    mygerrit-cli = mygerrit_cli.gerrit_cli:main
